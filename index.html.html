<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mahadev Computer Service Center</title>
<meta name="description" content="Mahadev Computer Service Center — laptop repair, printer service, CCTV installation, AMC and on-site support.">
<style>
:root{
  --brand:#c62828; --brand-dark:#8e0000; --brand-light:#ff5f52;
  --bg:#f7f7f9; --card:#fff; --text:#1c1c1e; --muted:#6b6b70;
  --border:#e3e3e8; --ok:#1b8a4b; --radius:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh;display:flex;flex-direction:column}
a{color:var(--brand);text-decoration:none}
a:hover{text-decoration:underline}
.container{width:min(1140px,92%);margin:0 auto}
header.nav{background:var(--brand);color:#fff;position:sticky;top:0;z-index:50;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.nav-inner{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:14px 0;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.15rem;color:#fff}
.brand .logo{width:38px;height:38px;border-radius:50%;background:#fff;color:var(--brand);
  display:grid;place-items:center;font-weight:800}
.nav-links{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.nav-links a{color:#fff;padding:8px 14px;border-radius:8px;font-size:.94rem;cursor:pointer}
.nav-links a:hover{background:rgba(255,255,255,.18);text-decoration:none}
.nav-links a.cta{background:#fff;color:var(--brand);font-weight:600}
.btn{display:inline-block;background:var(--brand);color:#fff;border:0;padding:12px 22px;
  border-radius:9px;font-size:.97rem;font-weight:600;cursor:pointer;transition:.15s;font-family:inherit}
.btn:hover{background:var(--brand-dark);text-decoration:none}
.btn.ghost{background:transparent;border:2px solid currentColor;color:var(--brand)}
.btn.ghost:hover{background:var(--brand);color:#fff}
.btn.sm{padding:7px 14px;font-size:.85rem}
.btn.block{display:block;width:100%;text-align:center}
main{flex:1;padding:34px 0 60px}
h1{font-size:2rem;margin-bottom:10px}
h2{font-size:1.4rem;margin:26px 0 14px}
h3{font-size:1.08rem;margin-bottom:6px}
.lead{color:var(--muted);font-size:1.05rem;max-width:70ch}
.hero{background:linear-gradient(135deg,var(--brand),var(--brand-dark));color:#fff;
  border-radius:16px;padding:52px 34px;margin-bottom:34px}
.hero h1{color:#fff;font-size:2.4rem}
.hero p{color:#ffe3e0;max-width:62ch;margin-bottom:22px}
.grid{display:grid;gap:18px}
.grid.cols-3{grid-template-columns:repeat(auto-fit,minmax(270px,1fr))}
.grid.cols-2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:22px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.card .icon{font-size:1.9rem;margin-bottom:8px}
.card p{color:var(--muted);font-size:.94rem;margin-bottom:14px}
.field{margin-bottom:16px}
label{display:block;font-weight:600;font-size:.9rem;margin-bottom:6px}
input,select,textarea{width:100%;padding:11px 13px;border:1px solid var(--border);
  border-radius:9px;font:inherit;background:#fff}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand-light);border-color:transparent}
textarea{resize:vertical;min-height:110px}
.auth-wrap{max-width:440px;margin:0 auto}
.auth-wrap .card{padding:30px}
.hint{font-size:.85rem;color:var(--muted);margin-top:10px;text-align:center}
.alert{padding:12px 15px;border-radius:9px;font-size:.92rem;margin-bottom:16px;display:none}
.alert.show{display:block}
.alert.err{background:#fdecea;color:#8c1d18;border:1px solid #f5c6c3}
.alert.ok{background:#e7f6ec;color:#0f5c2e;border:1px solid #b8e0c6}
table{width:100%;border-collapse:collapse;font-size:.92rem;background:#fff}
th,td{padding:11px 13px;text-align:left;border-bottom:1px solid var(--border)}
th{background:#fafafb;font-size:.82rem;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}
.badge{padding:3px 10px;border-radius:20px;font-size:.78rem;font-weight:600;display:inline-block}
.badge.new{background:#fdecea;color:#8c1d18}
.badge.progress{background:#fff4e0;color:#8a5300}
.badge.done{background:#e7f6ec;color:#0f5c2e}
.chat-layout{display:grid;grid-template-columns:260px 1fr;gap:0;border:1px solid var(--border);
  border-radius:var(--radius);overflow:hidden;background:#fff;height:70vh;min-height:460px}
.chat-list{border-right:1px solid var(--border);overflow-y:auto;background:#fafafb}
.chat-list .item{padding:13px 15px;border-bottom:1px solid var(--border);cursor:pointer;font-size:.9rem}
.chat-list .item.active{background:#fff;border-left:3px solid var(--brand)}
.chat-list .item:hover{background:#fff}
.chat-list .item small{color:var(--muted);display:block;font-size:.78rem}
.chat-panel{display:flex;flex-direction:column}
.chat-head{padding:13px 18px;border-bottom:1px solid var(--border);font-weight:600;background:#fafafb}
.chat-body{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:74%;padding:10px 14px;border-radius:14px;font-size:.93rem;word-wrap:break-word}
.msg .meta{font-size:.72rem;opacity:.7;margin-top:5px;display:block}
.msg.me{align-self:flex-end;background:var(--brand);color:#fff;border-bottom-right-radius:4px}
.msg.them{align-self:flex-start;background:#eef0f3;border-bottom-left-radius:4px}
.msg a{color:inherit;text-decoration:underline}
.chat-foot{border-top:1px solid var(--border);padding:12px;display:flex;flex-direction:column;gap:9px}
.chat-foot .row{display:flex;gap:9px}
.file-row{font-size:.83rem;color:var(--muted);display:flex;align-items:center;gap:8px}
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:24px}
.stat{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:18px}
.stat b{display:block;font-size:1.8rem;color:var(--brand)}
.stat span{font-size:.85rem;color:var(--muted)}
.tabs{display:flex;gap:6px;border-bottom:2px solid var(--border);margin-bottom:20px;flex-wrap:wrap}
.tabs button{background:none;border:0;padding:11px 17px;font:inherit;font-weight:600;color:var(--muted);
  cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs button.active{color:var(--brand);border-bottom-color:var(--brand)}
.tab-panel{display:none}
.tab-panel.active{display:block}
.empty{text-align:center;color:var(--muted);padding:44px 20px;font-size:.95rem}
footer{background:#1c1c1e;color:#a9a9b0;padding:30px 0;font-size:.9rem}
footer a{color:#fff;cursor:pointer}
.footer-inner{display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap}
@media(max-width:760px){
  .chat-layout{grid-template-columns:1fr;height:auto}
  .chat-list{max-height:180px;border-right:0;border-bottom:1px solid var(--border)}
  .chat-body{height:340px}
  .hero{padding:34px 22px}.hero h1{font-size:1.7rem}
}
</style>
</head>

  <div class="container nav-inner">

<script src="[cdn.jsdelivr.net](https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2)"></script>
<script>
/* ══════════════════════════════════════════════════════════════
   1. CONFIG  ← FILL THESE IN
   Supabase dashboard → Project Settings → API
   ══════════════════════════════════════════════════════════════ */
const SUPABASE_URL  = "[your-project.supabase.co](https://YOUR-PROJECT.supabase.co)";
const SUPABASE_ANON = "YOUR-PUBLIC-ANON-KEY";
/* ══════════════════════════════════════════════════════════════ */

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
const app = document.getElementById("app");
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmtDate = (d) =>
  new Date(d).toLocaleString("en-IN", { dateStyle: "medium", timeStyle: "short" });
const toast = (el, msg, type = "err") => {
  if (!el) return;
  el.textContent = msg;
  el.className = "alert show " + type;
  if (type === "ok") setTimeout(() => el.classList.remove("show"), 5000);
};

/* ── services catalogue ── */
const SERVICES = [
  { id:"laptop-repair",   icon:"💻", name:"Laptop & Desktop Repair",  desc:"Hardware faults, screen replacement, keyboard, battery, overheating and full diagnostics.",
    points:["Free diagnosis","Screen / keyboard / battery replacement","Overheating & fan cleaning","Motherboard level repair"] },
  { id:"printer-service", icon:"🖨️", name:"Printer Sales & Service", desc:"Inkjet & laser printer repair, cartridge refilling, network printing setup and AMC.",
    points:["Inkjet & laser repair","Cartridge refill","Network printer setup","Annual maintenance"] },
  { id:"cctv-install",    icon:"📹", name:"CCTV Installation",        desc:"HD & IP camera supply, installation, DVR/NVR configuration and mobile viewing.",
    points:["HD / IP camera supply","DVR & NVR configuration","Mobile app viewing setup","Cable & power work"] },
  { id:"software-os",     icon:"⚙️", name:"Software & OS Installation", desc:"Windows/Linux install, MS Office, drivers, antivirus and full system formatting.",
    points:["Windows / Linux installation","MS Office & essential apps","Driver & antivirus setup","Full system formatting"] },
  { id:"data-recovery",   icon:"💾", name:"Data Recovery & Backup",   desc:"Recovery from crashed drives, pen drives and memory cards; scheduled cloud backup.",
    points:["Crashed drive recovery","Pen drive & memory card recovery","Data backup to cloud / external","Secure data wipe"] },
  { id:"networking",      icon:"🌐", name:"Networking & Wi-Fi",       desc:"Router setup, LAN cabling, Wi-Fi range extension and small-office network design.",
    points:["Router & switch setup","LAN cabling","Wi-Fi range extension","Small office network design"] },
  { id:"amc",             icon:"📋", name:"Annual Maintenance (AMC)", desc:"Yearly contracts for offices, schools and shops with priority on-site support.",
    points:["Yearly priority support","Scheduled preventive maintenance","Unlimited on-site visits","Discounted spares"] },
  { id:"accessories",     icon:"🛒", name:"Computer Accessories",     desc:"Laptop bags, RAM, SSD upgrades, mouse, keyboard, UPS and genuine spares.",
    points:["RAM & SSD upgrades","Laptop bags, mouse, keyboard","UPS & power backup","Genuine spare parts"] },
  { id:"onsite",          icon:"🚚", name:"On-Site / Doorstep Visit", desc:"Technician visits your home or office anywhere in the local service area.",
    points:["Doorstep technician visit","Home & office service","Same-day slots","Post-service follow-up"] },
];
const findService = (id) => SERVICES.find((s) => s.id === id) || SERVICES[0];

/* ── auth state ── */
let SESSION = null, PROFILE = null, CHANNEL = null;

async function loadSession() {
  const { data: { session } } = await sb.auth.getSession();
  SESSION = session;
  PROFILE = null;
  if (session) {
    const { data } = await sb.from("profiles").select("*").eq("id", session.user.id).single();
    PROFILE = data;
  }
  return session;
}
function renderNav() {
  const box = $("#navAuth");
  if (SESSION) {
    const first = (PROFILE?.full_name || SESSION.user.email).split(" ")[0];
    box.innerHTML = `<a href="#/dashboard">Dashboard</a><a href="#" id="logoutBtn">Logout (${esc(first)})</a>`;
    $("#logoutBtn").onclick = async (e) => {
      e.preventDefault(); await sb.auth.signOut(); location.hash = "#/"; location.reload();
    };
  } else {
    box.innerHTML = `<a href="#/login">Login</a><a href="#/register" class="cta">Register</a>`;
  }
}
function stopChannel() { if (CHANNEL) { sb.removeChannel(CHANNEL); CHANNEL = null; } }

/* ── upload helper (shared by chat pages) ── */
async function uploadChatFile(file, folder, prefix) {
  if (!file) return { url: null, name: null };
  if (file.size > 10 * 1024 * 1024) throw new Error("File too large — 10 MB maximum.");
  const path = `${folder}/${Date.now()}-${prefix}-${file.name.replace(/[^\w.\-]/g, "_")}`;
  const up = await sb.storage.from("chat-uploads").upload(path, file);
  if (up.error) throw new Error(up.error.message);
  const signed = await sb.storage.from("chat-uploads").createSignedUrl(path, 60 * 60 * 24 * 30);
  return { url: signed.data?.signedUrl || null, name: file.name };
}

/* ══════════════════════════════════════════════════════════════
   2. PAGE TEMPLATES
   ══════════════════════════════════════════════════════════════ */

function pageHome() {
  return `
  <section class="hero">
    <h1>Computer &amp; Electronics Service You Can Trust</h1>
    <p>Laptop repair, printer service, CCTV installation, networking, data recovery and annual maintenance — by certified technicians, at your doorstep.</p>
    <a class="btn" href="#/register">Create an Account</a>
    <a class="btn ghost" style="color:#fff;border-color:#fff" href="#/services">Browse Services</a>
  </section>

  <p class="lead">Every service has its own page with details and an online booking form.</p>

    ${SERVICES.slice(0, 6).map(serviceCard).join("")}
  </div>
  <p style="margin-top:18px"><a class="btn ghost" href="#/services">View all services →</a></p>

  <h2>How It Works</h2>
  <div class="grid cols-3">
    <div class="card"><div class="icon">📝</div><h3>1. Register &amp; Book</h3><p>Create your free account and submit a service request in under a minute.</p></div>
    <div class="card"><div class="icon">💬</div><h3>2. Chat With Us</h3><p>Use live chat to share photos, bills or documents so we diagnose faster.</p></div>

  </div>

  <h2>Why Choose Us</h2>
  <div class="grid cols-3">
    <div class="card"><div class="icon">⚡</div><h3>Fast Response</h3><p>Same-day doorstep visits within the local service area.</p></div>
    <div class="card"><div class="icon">🛡️</div><h3>Genuine Spares</h3><p>Only original parts, with a warranty on every repair.</p></div>
    <div class="card"><div class="icon">💰</div><h3>Transparent Pricing</h3><p>Free diagnosis and a quote before any work begins.</p></div>
  </div>`;
}
const serviceCard = (s) => `
  <article class="card">
    <div class="icon">${s.icon}</div>
    <h3>${esc(s.name)}</h3>
    <p>${esc(s.desc)}</p>

  </article>`;

function pageServices() {
  return `
  <h1>Our Services</h1>
  <p class="lead">Choose a service to see details and send a booking request. You can also raise a general enquiry from live chat.</p>
  <div class="grid cols-3" style="margin-top:26px">${SERVICES.map(serviceCard).join("")}</div>
  <div class="card" style="margin-top:30px">
    <h3>Not sure what you need?</h3>
    <p>Describe the problem in live chat — our team will guide you to the right service.</p>
    <a class="btn" href="#/chat">Open Live Chat</a>

}

function pageServiceDetail(id) {
  const s = findService(id);
  return `

  <h1>${s.icon}  ${esc(s.name)}</h1>
  <p class="lead">${esc(s.desc)}</p>
  <div class="grid cols-2" style="margin-top:26px">
    <div class="card">
      <h3>What's included</h3>
      <ul style="padding-left:20px;color:var(--muted);font-size:.95rem">
        ${s.points.map((p) => `<li>${esc(p)}</li>`).join("")}
      </ul>

    <div class="card">
      <h3>Book this service</h3>
      <p>Send a request — we'll confirm the visit slot by chat or phone.</p>
      <div class="alert" id="msg"></div>
      ${
        SESSION
          ? `<form id="reqForm">
              <div class="field"><label for="issue">Describe the problem</label>
                <textarea id="issue" required placeholder="e.g. Laptop switches off after 10 minutes, fan noise loud."></textarea></div>
              <div class="field"><label for="pref">Preferred visit date</label>
                <input id="pref" type="date"></div>
              <div class="field"><label for="addr">Address for on-site visit</label>
                <input id="addr" value="${esc(PROFILE?.address || "")}" placeholder="House / shop, area, landmark"></div>
              <button class="btn block" type="submit">Submit service request</button>
            </form>`
          : `<p class="hint" style="text-align:left">Please <a href="#/login">log in</a> or <a href="#/register">register</a> to submit a request.</p>`
      }
    </div>
  </div>`;
}

  <div class="auth-wrap">

function pageChat() {
  if (!SESSION) {
    return `
    <h1>Live Chat Support</h1>
    <div class="card" style="margin-top:20px">
      <h3>Please log in to use live chat</h3>
      <p>Chat history and uploaded files stay attached to your account, so our technicians can follow up.</p>
      <a class="btn" href="#/login">Login</a>
      <a class="btn ghost" href="#/register">Register</a>
    </div>`;
  }
  return `
  <h1>Live Chat Support</h1>
  <p class="lead" style="margin-bottom:20px">Ask a question or attach photos, bills and documents — our team replies here.</p>
  <div class="alert" id="msg"></div>
  <div class="chat-layout">
    <aside class="chat-list">
      <div class="item active">
        <strong>Service Center Support</strong>
        <small>Start or continue your conversation</small>
      </div>
      <div class="item" style="cursor:default">
        <strong>Uploads</strong>
        <small>PDF, images, docs up to 10 MB</small>
      </div>
    </aside>
    <section class="chat-panel">
      <div class="chat-head">Support — ${esc(PROFILE?.full_name || SESSION.user.email)}</div>
      <div class="chat-body" id="chatBody"><div class="empty">Loading…</div></div>
      <div class="chat-foot">
        <div class="row">
          <input type="file" id="fileInput" style="flex:0 0 auto;width:auto;padding:7px"
            accept=".pdf,.jpg,.jpeg,.png,.webp,.doc,.docx,.txt">
          <span class="file-row" id="fileName"></span>
        </div>
        <div class="row">
          <input id="msgInput" placeholder="Type your message…" autocomplete="off">
          <button class="btn" id="sendBtn">Send</button>
        </div>
      </div>
    </section>
  </div>`;
}

  <h1>Admin Dashboard</h1>

/* ══════════════════════════════════════════════════════════════
   3. PAGE BEHAVIOUR (runs after each render)
   ══════════════════════════════════════════════════════════════ */
const BEHAVIOUR = {
  register() {
    $("#regForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = e.target.querySelector("button");
      btn.disabled = true; btn.textContent = "Creating…";
      const meta = {
        full_name: $("#name").value.trim(),
        phone: $("#phone").value.trim(),
        address: $("#address").value.trim(),
      };
      const { data, error } = await sb.auth.signUp({
        email: $("#email").value.trim(),
        password: $("#password").value,
        options: { data: meta },
      });
      btn.disabled = false; btn.textContent = "Create account";
      if (error) return toast($("#msg"), error.message);
      if (data.user) {
        await sb.from("profiles").upsert({
          id: data.user.id, full_name: meta.full_name, phone: meta.phone,
          address: meta.address, role: "customer",
        });
      }
      if (!data.session) {
        toast($("#msg"), "Account created. Check your email to confirm, then log in.", "ok");
        setTimeout(() => (location.hash = "#/login"), 2500);
      } else {
        toast($("#msg"), "Account created! Redirecting…", "ok");
        setTimeout(() => location.reload(), 1000);
      }
    });
  },

  login() {
    $("#loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = e.target.querySelector("button");
      btn.disabled = true; btn.textContent = "Signing in…";
      const { error } = await sb.auth.signInWithPassword({
        email: $("#email").value.trim(), password: $("#password").value,
      });
      btn.disabled = false; btn.textContent = "Login";
      if (error) return toast($("#msg"), error.message);
      location.hash = "#/dashboard"; location.reload();
    });
    $("#forgot").onclick = async (e) => {
      e.preventDefault();
      const email = $("#email").value.trim();
      if (!email) return toast($("#msg"), "Enter your email above first.");
      const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.href });
      toast($("#msg"), error ? error.message : "Reset link sent — check your inbox.", error ? "err" : "ok");
    };
  },

  "admin-login"() {
    $("#adminForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = e.target.querySelector("button");
      btn.disabled = true; btn.textContent = "Checking…";
      const { data, error } = await sb.auth.signInWithPassword({
        email: $("#email").value.trim(), password: $("#password").value,
      });
      if (error) {
        btn.disabled = false; btn.textContent = "Login as Admin";
        return toast($("#msg"), error.message);
      }
      const { data: prof } = await sb.from("profiles").select("role").eq("id", data.user.id).single();
      if (prof?.role !== "admin") {
        await sb.auth.signOut();
        btn.disabled = false; btn.textContent = "Login as Admin";
        return toast($("#msg"), "This account is not an admin account.");
      }
      location.hash = "#/admin"; location.reload();
    });
  },

  "service-detail"({ id }) {
    const s = findService(id);
    document.title = s.name + " — Mahadev Computer Service Center";
    const form = $("#reqForm");
    if (!form) return;
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = form.querySelector("button");
      btn.disabled = true; btn.textContent = "Sending…";
      const { error } = await sb.from("service_requests").insert({
        user_id: SESSION.user.id,
        customer_email: SESSION.user.email,
        customer_name: PROFILE?.full_name || SESSION.user.email,
        customer_phone: PROFILE?.phone || null,
        service_id: s.id, service_name: s.name,
        issue: $("#issue").value.trim(),
        preferred_date: $("#pref").value || null,
        address: $("#addr").value.trim() || null,
        status: "new",
      });
      btn.disabled = false; btn.textContent = "Submit service request";
      if (error) return toast($("#msg"), error.message);
      toast($("#msg"), "Request submitted! Track it on your dashboard.", "ok");
      form.reset();
      setTimeout(() => (location.hash = "#/dashboard"), 1400);
    });
  },

  dashboard() {
    const badge = (s) => {
      const c = s === "new" ? "new" : s === "in_progress" ? "progress" : "done";
      const t = { new: "New", in_progress: "In progress", completed: "Completed", cancelled: "Cancelled" }[s] || s;
      return `<span class="badge ${c}">${t}</span>`;
    };
    $$(".tabs button").forEach((b) => (b.onclick = () => {
      $$(".tabs button").forEach((x) => x.classList.remove("active"));
      $$(".tab-panel").forEach((p) => p.classList.remove("active"));
      b.classList.add("active");
      $("#tab-" + b.dataset.tab).classList.add("active");
    }));

    async function loadRequests() {
      const { data, error } = await sb.from("service_requests")
        .select("*").eq("user_id", SESSION.user.id).order("created_at", { ascending: false });
      if (error) return toast($("#msg"), error.message);
      $("#reqBody").innerHTML = (data || []).map((r) => `
        <tr>
          <td><strong>${esc(r.service_name)}</strong></td>
          <td>${esc((r.issue || "").slice(0, 70))}</td>
          <td>${fmtDate(r.created_at)}</td>
          <td>${badge(r.status)}</td>
          <td><a class="btn sm ghost" href="#/chat">Chat</a></td>
        </tr>`).join("");
      $("#reqEmpty").style.display = data && data.length ? "none" : "block";
    }
    loadRequests();

    $("#newReq").addEventListener("submit", async (e) => {
      e.preventDefault();
      const s = findService($("#svcSel").value);
      const { error } = await sb.from("service_requests").insert({
        user_id: SESSION.user.id,
        customer_email: SESSION.user.email,
        customer_name: PROFILE?.full_name || SESSION.user.email,
        customer_phone: PROFILE?.phone || null,
        service_id: s.id, service_name: s.name,
        issue: $("#issue2").value.trim(),
        preferred_date: $("#pref2").value || null,
        address: $("#addr2").value.trim() || null,
        status: "new",
      });
      if (error) return toast($("#msg2"), error.message);
      toast($("#msg2"), "Request submitted!", "ok");
      $("#newReq").reset();
      loadRequests();
    });

    $("#profForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const row = {
        id: SESSION.user.id, full_name: $("#pName").value,
        phone: $("#pPhone").value, address: $("#pAddr").value,
        role: PROFILE?.role || "customer",
      };
      const { error } = await sb.from("profiles").upsert(row);
      if (!error) PROFILE = { ...PROFILE, ...row };
      toast($("#msg3"), error ? error.message : "Profile saved.", error ? "err" : "ok");
    });
  },

  chat() {
    if (!SESSION) return;
    const ME = SESSION.user.id;
    const bubble = (m) => {
      const mine = m.sender_id === ME;
      const file = m.file_url
        ? `<a href="${m.file_url}" target="_blank" rel="noopener">📎 ${esc(m.file_name || "Attachment")}</a>` : "";
      const body = esc(m.body || "");
      return `<div class="msg ${mine ? "me" : "them"}">${body}${body && file ? "<br>" : ""}${file}
        <span class="meta">${mine ? "You" : "Support"} · ${fmtDate(m.created_at)}</span></div>`;
    };
    async function loadThread() {
      const { data, error } = await sb.from("messages")
        .select("*").eq("user_id", ME).order("created_at", { ascending: true });
      if (error) return toast($("#msg"), error.message);
      const body = $("#chatBody");
      body.innerHTML = data && data.length ? data.map(bubble).join("")
        : '<div class="empty">No messages yet — say hello 👋</div>';
      body.scrollTop = body.scrollHeight;
    }
    loadThread();

    CHANNEL = sb.channel("chat-" + ME)
      .on("postgres_changes",
          { event: "INSERT", schema: "public", table: "messages", filter: `user_id=eq.${ME}` },
          () => loadThread())
      .subscribe();

    $("#fileInput").addEventListener("change", (e) => {
      $("#fileName").textContent = e.target.files[0]?.name || "";
    });

    async function send() {
      const input = $("#msgInput");
      const text = input.value.trim();
      const file = $("#fileInput").files[0];
      if (!text && !file) return;
      const btn = $("#sendBtn"); btn.disabled = true; btn.textContent = "Sending…";
      let up = { url: null, name: null };
      try { up = await uploadChatFile(file, ME, "cust"); }
      catch (err) { btn.disabled = false; btn.textContent = "Send"; return toast($("#msg"), err.message); }

      const { error } = await sb.from("messages").insert({
        user_id: ME, sender_id: ME, sender_role: "customer",
        body: text || null, file_url: up.url, file_name: up.name,
      });
      btn.disabled = false; btn.textContent = "Send";
      if (error) return toast($("#msg"), error.message);
      input.value = ""; $("#fileInput").value = ""; $("#fileName").textContent = "";
      loadThread();
    }
    $("#sendBtn").onclick = send;
    $("#msgInput").addEventListener("keydown", (e) => { if (e.key === "Enter") send(); });
  },

  admin() {
    const statusOpt = (v) => `
      <select class="statusSel">
        <option value="new"${v === "new" ? " selected" : ""}>New</option>
        <option value="in_progress"${v === "in_progress" ? " selected" : ""}>In progress</option>
        <option value="completed"${v === "completed" ? " selected" : ""}>Completed</option>
        <option value="cancelled"${v === "cancelled" ? " selected" : ""}>Cancelled</option>
      </select>`;
    const bubble = (m) => {
      const mine = m.sender_role === "admin";
      const file = m.file_url
        ? `<a href="${m.file_url}" target="_blank" rel="noopener">📎 ${esc(m.file_name || "Attachment")}</a>` : "";
      const body = esc(m.body || "");
      return `<div class="msg ${mine ? "me" : "them"}">${body}${body && file ? "<br>" : ""}${file}
        <span class="meta">${mine ? "Admin" : "Customer"} · ${fmtDate(m.created_at)}</span></div>`;
    };
    let ACTIVE = null;

    $$(".tabs button").forEach((b) => (b.onclick = () => {
      $$(".tabs button").forEach((x) => x.classList.remove("active"));
      $$(".tab-panel").forEach((p) => p.classList.remove("active"));
      b.classList.add("active");
      $("#tab-" + b.dataset.tab).classList.add("active");
    }));

    async function loadRequests() {
      const { data, error } = await sb.from("service_requests")
        .select("*").order("created_at", { ascending: false });
      if (error) return toast($("#msg"), error.message);
      const rows = data || [];
      $("#reqBody").innerHTML = rows.map((r) => `
        <tr>
          <td><strong>${esc(r.customer_name || "—")}</strong></td>
          <td>${esc(r.customer_email || "")}<br><small>${esc(r.customer_phone || "")}</small></td>
          <td>${esc(r.service_name)}</td>
          <td>${esc((r.issue || "").slice(0, 90))}</td>
          <td>${r.preferred_date || "—"}</td>
          <td>${statusOpt(r.status)}</td>
          <td><button class="btn sm saveRow" data-id="${r.id}">Save</button></td>
        </tr>`).join("");
      $("#reqEmpty").style.display = rows.length ? "none" : "block";
      $("#stTotal").textContent = rows.length;
      $("#stNew").textContent = rows.filter((r) => r.status === "new").length;
      $("#stProgress").textContent = rows.filter((r) => r.status === "in_progress").length;

      $$(".saveRow").forEach((btn) => (btn.onclick = async () => {
        const status = btn.closest("tr").querySelector(".statusSel").value;
        const { error } = await sb.from("service_requests").update({ status }).eq("id", btn.dataset.id);
        if (error) return toast($("#msg"), error.message);
        toast($("#msg"), "Status updated.", "ok");
        loadRequests();
      }));
    }

    async function loadThreads() {
      const { data, error } = await sb.from("messages")
        .select("*").order("created_at", { ascending: false });
      if (error) return toast($("#msg"), error.message);
      const map = new Map();
      (data || []).forEach((m) => { if (!map.has(m.user_id)) map.set(m.user_id, m); });
      $("#stChats").textContent = map.size;
      if (!map.size) {
        $("#threadList").innerHTML =
          '<div class="empty" style="padding:22px 14px;font-size:.86rem">No messages yet.</div>';
        return;
      }
      $("#threadList").innerHTML = [...map.entries()].map(([uid, last]) => `
        <div class="item ${ACTIVE === uid ? "active" : ""}" data-uid="${uid}">
          <strong>${esc(last.customer_name || uid.slice(0, 8))}</strong>
          <small>${esc((last.body || "📎 Attachment").slice(0, 42))}</small>
          <small>${fmtDate(last.created_at)}</small>
        </div>`).join("");
      $$("#threadList .item").forEach((el) => (el.onclick = () => openThread(el.dataset.uid)));
    }

    async function openThread(uid) {
      ACTIVE = uid;
      $$("#threadList .item").forEach((x) => x.classList.toggle("active", x.dataset.uid === uid));
      const { data, error } = await sb.from("messages")
        .select("*").eq("user_id", uid).order("created_at", { ascending: true });
      if (error) return toast($("#msg"), error.message);
      $("#threadHead").textContent = "Conversation · " + uid.slice(0, 8);
      $("#chatBody").innerHTML = (data || []).map(bubble).join("") ||
        '<div class="empty">No messages in this thread.</div>';
      $("#chatBody").scrollTop = $("#chatBody").scrollHeight;
      $("#msgInput").disabled = false;
      $("#sendBtn").disabled = false;

      stopChannel();
      CHANNEL = sb.channel("admin-chat-" + uid)
        .on("postgres_changes",
            { event: "INSERT", schema: "public", table: "messages", filter: `user_id=eq.${uid}` },
            () => openThread(uid))
        .subscribe();
    }

    $("#fileInput").addEventListener("change", (e) => {
      $("#fileName").textContent = e.target.files[0]?.name || "";
    });

    $("#sendBtn").onclick = async () => {
      if (!ACTIVE) return;
      const text = $("#msgInput").value.trim();
      const file = $("#fileInput").files[0];
      if (!text && !file) return;
      const btn = $("#sendBtn"); btn.disabled = true; btn.textContent = "Sending…";
      let up = { url: null, name: null };
      try { up = await uploadChatFile(file, ACTIVE, "admin"); }
      catch (err) { btn.disabled = false; btn.textContent = "Send"; return toast($("#msg"), err.message); }

      const { error } = await sb.from("messages").insert({
        user_id: ACTIVE, sender_id: SESSION.user.id, sender_role: "admin",
        body: text || null, file_url: up.url, file_name: up.name,
      });
      btn.disabled = false; btn.textContent = "Send";
      if (error) return toast($("#msg"), error.message);
      $("#msgInput").value = ""; $("#fileInput").value = ""; $("#fileName").textContent = "";
      openThread(ACTIVE); loadThreads();
    };
    $("#msgInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter") $("#sendBtn").click();
    });

    loadRequests(); loadThreads();
    sb.channel("admin-live")
      .on("postgres_changes", { event: "*", schema: "public", table: "service_requests" }, loadRequests)
      .subscribe();
  },
};

/* ══════════════════════════════════════════════════════════════
   4. ROUTER
   ══════════════════════════════════════════════════════════════ */
const TITLES = {
  "": "Mahadev Computer Service Center",
  services: "All Services — Mahadev Computer Service Center",
  register: "Register — Mahadev Computer Service Center",
  login: "Login — Mahadev Computer Service Center",
  dashboard: "My Dashboard — Mahadev Computer Service Center",
  chat: "Live Chat — Mahadev Computer Service Center",
  "admin-login": "Admin Login — Mahadev Computer Service Center",
  admin: "Admin Dashboard — Mahadev Computer Service Center",
};

async function route() {
  stopChannel();
  await loadSession();
  renderNav();

  const parts = location.hash.replace(/^#\/?/, "").split("/").filter(Boolean);
  const page = parts[0] || "home";
  const param = parts[1];
  const go = (hash) => { location.hash = hash; };

  /* guards */
  const needsAuth  = ["dashboard", "chat"];
  const needsAdmin = ["admin"];
  if (needsAuth.includes(page) && !SESSION)  return go("#/login");
  if (needsAdmin.includes(page) && (!SESSION || PROFILE?.role !== "admin")) return go("#/admin-login");

  let html, key = page;
  switch (page) {
    case "home":         html = pageHome(); break;
    case "services":     html = pageServices(); break;
    case "service":      html = pageServiceDetail(param); key = "service-detail"; break;
    case "register":     html = pageRegister(); break;
    case "login":        html = pageLogin(); break;
    case "dashboard":    html = pageDashboard(); break;
    case "chat":         html = pageChat(); break;
    case "admin-login":  html = pageAdminLogin(); break;
    case "admin":        html = pageAdminDashboard(); break;
    default:             html = `<h1>Page not found</h1><p class="lead">That link doesn't exist.</p>
                                 <p style="margin-top:16px"><a class="btn" href="#/">Back to home</a></p>`;
  }

  app.innerHTML = html;
  document.title = TITLES[page] || TITLES[""];
  window.scrollTo(0, 0);

  try { BEHAVIOUR[key]?.({ id: param }); }
  catch (err) { console.error(err); }

  /* keep nav in sync on logout from a guarded page */
  if (SESSION) document.getElementById("navAuth") &&
    ($("#navAuth").querySelectorAll("a")[1] || {}).addEventListener?.("click", () => {});
}

window.addEventListener("hashchange", route);
sb.auth.onAuthStateChange(() => route());
route();
</script>
