<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Login — Mahadev Computer Service Center</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="nav">
  <div class="container nav-inner">
    <a href="index.html" class="brand"><span class="logo">M</span> Mahadev Computer Service Center</a>
    <nav class="nav-links"><a href="index.html">Home</a><a href="services.html">Services</a>
      <a href="login.html">Customer Login</a><span id="navAuth"></span></nav>
  </div>
</header>

<main class="container">
  <div class="auth-wrap">
    <h1>Admin Login</h1>
    <p class="lead" style="margin-bottom:20px">Staff access only — service requests and customer chat.</p>
    <div class="card">
      <div class="alert" id="msg"></div>
      <form id="adminForm">
        <div class="field"><label for="email">Admin email</label><input id="email" type="email" required></div>
        <div class="field"><label for="password">Password</label><input id="password" type="password" required></div>
        <button class="btn block" type="submit">Login as Admin</button>
      </form>
      <p class="hint">Customers, log in <a href="login.html">here</a>.</p>
    </div>
  </div>
</main>

<footer><div class="container footer-inner"><div><strong>Mahadev Computer Service Center</strong></div>
  <div><a href="index.html">Home</a> · <a href="login.html">Customer Login</a></div></div></footer>

<script src="[cdn.jsdelivr.net](https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2)"></script>
<script src="js/config.js"></script><script src="js/app.js"></script>
<script>
$("#adminForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = e.target.querySelector("button");
  btn.disabled = true; btn.textContent = "Checking…";
  const { data, error } = await sb.auth.signInWithPassword({
    email: $("#email").value.trim(), password: $("#password").value,
  });
  if (error) { btn.disabled = false; btn.textContent = "Login as Admin"; return toast($("#msg"), error.message); }

  const { data: prof } = await sb.from("profiles").select("role").eq("id", data.user.id).single();
  if (prof?.role !== "admin") {
    await sb.auth.signOut();
    btn.disabled = false; btn.textContent = "Login as Admin";
    return toast($("#msg"), "This account is not an admin account.");
  }
  location.href = "admin-dashboard.html";
});
</script>
</body>
</html>
